<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마진 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f1f3;
    --border: #e0e2e7;
    --border2: #c8cad1;
    --text: #1a1c22;
    --text2: #555a66;
    --text3: #9499a6;
    --accent: #2563eb;
    --accent2: #1d4ed8;
    --red: #dc2626;
    --green: #16a34a;
    --input-bg: #f8f9fb;
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    min-height: 100vh;
  }

  header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 14px; font-weight: 700; color: #2563eb; letter-spacing: 0.05em; text-transform: uppercase; }
  header span { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: #2563eb; color: #2563eb; }
  .btn-accent { background: #2563eb; border-color: #2563eb; color: #ffffff; font-weight: 700; }
  .btn-accent:hover { background: #1d4ed8; border-color: #1d4ed8; color: #ffffff; }

  main { padding: 24px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .panel-header h2 { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
  .toggle-icon { margin-left: auto; font-size: 11px; color: var(--text3); }
  .panel-body { padding: 16px 18px; }
  .panel-body.hidden { display: none; }

  .shipping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .shipping-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .shipping-item label { display: block; font-size: 10px; color: var(--text3); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
  .shipping-item input { width: 100%; background: transparent; border: none; color: var(--text); font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 500; outline: none; }
  .shipping-item input:focus { color: var(--accent); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .table-toolbar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .table-toolbar h2 { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; min-width: 1200px; }
  thead tr { background: var(--surface2); border-bottom: 1px solid var(--border2); }
  th {
    padding: 10px 12px;
    text-align: right;
    font-size: 10px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    border-right: 1px solid var(--border);
  }
  th:first-child { text-align: left; }
  th:last-child { border-right: none; }
  .col-input { color: #1d4ed8 !important; }
  .col-result { color: #2563eb !important; }
  .col-highlight { color: #1d4ed8 !important; }

  /* 열 배경색 */
  .bg-price  { background: rgba(37, 99, 235, 0.06) !important; }
  .bg-fee    { background: rgba(220, 38,  38, 0.05) !important; }
  .bg-margin { background: rgba(37, 99, 235, 0.04) !important; }

  td.td-input.bg-price input { color: #1d4ed8; }
  td.td-input.bg-price input:focus { background: rgba(37, 99, 235, 0.10); }
  td.td-input.bg-fee   input { color: #dc2626; }
  td.td-input.bg-fee   input:focus { background: rgba(220, 38, 38, 0.10); }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody tr:last-child { border-bottom: none; }

  td { padding: 0; border-right: 1px solid var(--border); vertical-align: middle; }
  td:last-child { border-right: none; }

  .cell {
    padding: 8px 12px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
  }
  .cell-name { text-align: left; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; color: var(--text); }
  .cell-origin { font-size: 11px; color: var(--text3); }

  td.td-input { padding: 0; }
  td.td-input input {
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: none;
    color: #1d4ed8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    text-align: right;
    outline: none;
    transition: background 0.15s;
    display: block;
  }
  td.td-input input:focus { background: rgba(37, 99, 235, 0.06); }
  td.td-input input::placeholder { color: var(--text3); }

  .cell-positive { color: var(--green) !important; font-weight: 500; }
  .cell-negative { color: var(--red) !important; font-weight: 500; }
  .cell-zero { color: var(--text3) !important; }
  .cell-margin-highlight { font-size: 13px; font-weight: 700; }

  .cell-action { padding: 8px 10px; text-align: center; }
  .btn-delete {
    background: transparent; border: none; color: var(--text3);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
    border-radius: 4px; transition: all 0.15s; line-height: 1;
  }
  .btn-delete:hover { color: var(--red); background: rgba(255,95,87,0.1); }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 24px; width: 360px; max-width: 90vw;
  }
  .modal h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 18px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-row input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 6px;
    font-size: 13px; font-family: 'Noto Sans KR', sans-serif; outline: none;
    transition: border-color 0.15s;
  }
  .form-row input:focus { border-color: var(--accent); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

  .summary-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px; margin-top: 16px;
    display: flex; gap: 28px; align-items: center; flex-wrap: wrap;
  }
  .summary-item { display: flex; flex-direction: column; gap: 3px; }
  .summary-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .summary-value { font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: #2563eb; }

  @media (max-width: 768px) {
    main { padding: 12px; }
    header { padding: 0 14px; }
    header span { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>마진 계산기</h1>
  <span>v1.1</span>
  <div class="header-actions">
    <button class="btn" onclick="resetAll()">초기화</button>
    <button class="btn btn-accent" onclick="openModal()">+ 상품 추가</button>
  </div>
</header>

<main>

  <div class="panel">
    <div class="panel-header" onclick="togglePanel()">
      <h2>📦 배송비 테이블 (계단 포함)</h2>
      <span style="font-size:11px; color:var(--text3); margin-left:8px;">팩수량 기준 자동 적용 · 수정 가능</span>
      <span class="toggle-icon" id="panel-toggle">▼ 펼치기</span>
    </div>
    <div class="panel-body hidden" id="panel-body">
      <div class="shipping-grid" id="shipping-grid"></div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-toolbar">
      <h2>상품 마진 계산기</h2>
      <span style="font-size:11px; color:var(--text3); margin-left:4px;">제안가 입력 시 자동 계산</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="min-width:90px; text-align:left;">상품명</th>
            <th class="col-input" style="min-width:65px;">원가 ✏</th>
            <th class="col-input bg-price" style="min-width:90px;">제안가 ✏</th>
            <th class="col-input" style="min-width:60px;">팩수량 ✏</th>
            <th class="col-input" style="min-width:60px;">병수량 ✏</th>
            <th class="col-input bg-fee" style="min-width:65px;">수수료% ✏</th>
            <th style="min-width:75px;">1팩판매가</th>
            <th style="min-width:75px;">1병판매가</th>
            <th class="bg-fee" style="min-width:75px;">수수료액</th>
            <th class="bg-fee" style="min-width:80px;">수수료제외</th>
            <th style="min-width:75px;">배송비</th>
            <th style="min-width:80px;">배송비제외</th>
            <th style="min-width:80px;">팩당정산가</th>
            <th class="col-highlight bg-margin" style="min-width:85px;">★ 1팩마진</th>
            <th class="col-result bg-margin" style="min-width:75px;">총마진</th>
            <th class="col-result bg-margin" style="min-width:65px;">마진율</th>
            <th style="min-width:40px; border-right:none;"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-item">
      <span class="summary-label">계산된 상품</span>
      <span class="summary-value" id="sum-count">0</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">평균 마진율</span>
      <span class="summary-value" id="sum-avg-rate">—</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">최고 1팩마진</span>
      <span class="summary-value" id="sum-best">—</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">최저 1팩마진</span>
      <span class="summary-value" id="sum-worst">—</span>
    </div>
  </div>

</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>상품 추가</h3>
    <div class="form-row">
      <label>상품명</label>
      <input type="text" id="new-name" placeholder="예: 2리터">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>원가 (₩)</label>
        <input type="number" id="new-cost" placeholder="1650">
      </div>
      <div class="form-row">
        <label>팩수량</label>
        <input type="number" id="new-pack" placeholder="4">
      </div>
      <div class="form-row">
        <label>병수량</label>
        <input type="number" id="new-bottle" placeholder="6">
      </div>
      <div class="form-row">
        <label>수수료 (%)</label>
        <input type="number" id="new-fee" placeholder="12" step="0.1">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-accent" onclick="addProduct()">추가</button>
    </div>
  </div>
</div>

<script>
// ── 배송비 테이블 ──────────────────────────────────────────
let shippingTable = [
  {qty:1,fee:1100},{qty:2,fee:2000},{qty:3,fee:3000},
  {qty:4,fee:3800},{qty:5,fee:4500},{qty:6,fee:5400},
  {qty:7,fee:6300},{qty:8,fee:7200},{qty:9,fee:8100},
  {qty:10,fee:9000},{qty:30,fee:24000},{qty:50,fee:40000},
  {qty:80,fee:64000},{qty:96,fee:76800},{qty:100,fee:80000},
  {qty:112,fee:89600},{qty:144,fee:115200}
];

function getShipping(packQty) {
  const sorted = [...shippingTable].sort((a,b) => a.qty - b.qty);
  for (let i = 0; i < sorted.length; i++) {
    if (packQty <= sorted[i].qty) return sorted[i].fee;
  }
  return sorted[sorted.length-1].fee;
}

// ── 상품 데이터 ────────────────────────────────────────────
let products = [
  {id:1,  name:'2리터',       cost:1650, pack:4,  bottle:6,  fee:12, price:''},
  {id:2,  name:'2리터(6팩)',   cost:1900, pack:6,  bottle:6,  fee:12, price:''},
  {id:3,  name:'500mL',      cost:2200, pack:3,  bottle:20, fee:12, price:''},
  {id:4,  name:'500mL(5팩)', cost:2450, pack:5,  bottle:20, fee:12, price:''},
  {id:5,  name:'330mL',      cost:2300, pack:2,  bottle:20, fee:12, price:''},
  {id:6,  name:'200mL',      cost:3600, pack:2,  bottle:30, fee:12, price:''},
  {id:7,  name:'200mL(30팩)',cost:3600, pack:30, bottle:30, fee:12, price:''},
  {id:8,  name:'1리터',      cost:2400, pack:2,  bottle:12, fee:12, price:''},
  {id:9,  name:'탄산수(10팩)',cost:5200, pack:10, bottle:30, fee:12, price:''},
  {id:10, name:'탄산수(2팩)', cost:5200, pack:2,  bottle:30, fee:12, price:''},
  {id:11, name:'탄산수(3팩)', cost:5500, pack:3,  bottle:20, fee:12, price:''},
  {id:12, name:'18.9L',      cost:2000, pack:2,  bottle:1,  fee:12, price:''},
  {id:13, name:'12L',        cost:3000, pack:2,  bottle:1,  fee:12, price:''},
  {id:14, name:'튀밥 4병',    cost:3300, pack:1,  bottle:4,  fee:12, price:''},
  {id:15, name:'튀밥 8병',    cost:6600, pack:1,  bottle:8,  fee:12, price:''},
  {id:16, name:'쌀',         cost:7750, pack:1,  bottle:8,  fee:12, price:''},
];
let nextId = 20;

// ── 계산 로직 ──────────────────────────────────────────────
function calc(p) {
  const price   = parseFloat(p.price)  || 0;
  const pack    = parseFloat(p.pack)   || 1;
  const bottle  = parseFloat(p.bottle) || 1;
  const feeRate = parseFloat(p.fee)    || 0;
  const cost    = parseFloat(p.cost)   || 0;
  if (!price) return null;
  const perPack    = price / pack;
  const perBottle  = price / (pack * bottle);
  const feeAmt     = price * (feeRate / 100);
  const afterFee   = price - feeAmt;
  const shipping   = getShipping(pack);
  const afterShip  = afterFee - shipping;
  const perPackNet = afterShip / pack;
  const marginPack = perPackNet - cost;
  const totalMargin= marginPack * pack;
  const marginRate = price > 0 ? (totalMargin / price) * 100 : 0;
  return {perPack, perBottle, feeAmt, afterFee, shipping, afterShip, perPackNet, marginPack, totalMargin, marginRate};
}

const fmt     = n => Math.round(n).toLocaleString('ko-KR');
const fmtRate = n => n.toFixed(2) + '%';
function colorClass(n) {
  if (n > 0) return 'cell-positive';
  if (n < 0) return 'cell-negative';
  return 'cell-zero';
}

// ── 핵심: 자동계산 셀만 업데이트 (DOM 재생성 없음 → 포커스 유지) ──
function updateCalcCells(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const r = calc(p);
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if (!row) return;
  const cells = row.querySelectorAll('.auto-cell');

  if (!r) {
    cells.forEach(c => { c.textContent = '—'; c.className = 'cell auto-cell'; });
    updateSummary();
    return;
  }

  const data = [
    {val: fmt(r.perPack),    cls: ''},
    {val: fmt(r.perBottle),  cls: ''},
    {val: fmt(r.feeAmt),     cls: ''},
    {val: fmt(r.afterFee),   cls: ''},
    {val: fmt(r.shipping),   cls: ''},
    {val: fmt(r.afterShip),  cls: ''},
    {val: fmt(r.perPackNet), cls: ''},
    {val: (r.marginPack   >= 0 ? '+' : '') + fmt(r.marginPack),   cls: 'cell-margin-highlight ' + colorClass(r.marginPack)},
    {val: (r.totalMargin  >= 0 ? '+' : '') + fmt(r.totalMargin),  cls: colorClass(r.totalMargin)},
    {val: fmtRate(r.marginRate), cls: colorClass(r.marginRate)},
  ];

  cells.forEach((c, i) => {
    c.textContent = data[i].val;
    c.className = 'cell auto-cell ' + (data[i].cls || '');
  });

  updateSummary();
}

// ── 테이블 초기 렌더링 (구조 생성, 이후엔 updateCalcCells만 호출) ──
function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  products.forEach(p => {
    const tr = document.createElement('tr');
    tr.dataset.id = p.id;

    function makeTdInput(field, val, placeholder, bgClass) {
      const td = document.createElement('td');
      td.className = 'td-input' + (bgClass ? ' ' + bgClass : '');
      const input = document.createElement('input');
      input.type = 'number';
      input.value = val;
      if (placeholder) input.placeholder = placeholder;
      input.addEventListener('input', () => {
        p[field] = input.value;
        updateCalcCells(p.id);
      });
      td.appendChild(input);
      return td;
    }

    const tdName = document.createElement('td');
    tdName.innerHTML = `<div class="cell cell-name">${p.name}</div>`;

    tr.appendChild(tdName);
    tr.appendChild(makeTdInput('cost',   p.cost,   '', ''));
    tr.appendChild(makeTdInput('price',  p.price,  '제안가', 'bg-price'));
    tr.appendChild(makeTdInput('pack',   p.pack,   '', ''));
    tr.appendChild(makeTdInput('bottle', p.bottle, '', ''));
    tr.appendChild(makeTdInput('fee',    p.fee,    '', 'bg-fee'));

    // 자동계산 셀 — 컬럼 순서: perPack, perBottle, feeAmt, afterFee, shipping, afterShip, perPackNet, marginPack, totalMargin, marginRate
    const autoBgClasses = ['','','bg-fee','bg-fee','','','','bg-margin','bg-margin','bg-margin'];
    for (let i = 0; i < 10; i++) {
      const td = document.createElement('td');
      if (autoBgClasses[i]) td.classList.add(autoBgClasses[i]);
      const div = document.createElement('div');
      div.className = 'cell auto-cell';
      div.textContent = '—';
      td.appendChild(div);
      tr.appendChild(td);
    }

    // 삭제 버튼
    const tdDel = document.createElement('td');
    tdDel.className = 'cell-action';
    const btnDel = document.createElement('button');
    btnDel.className = 'btn-delete';
    btnDel.textContent = '✕';
    btnDel.addEventListener('click', () => deleteProduct(p.id));
    tdDel.appendChild(btnDel);
    tr.appendChild(tdDel);

    tbody.appendChild(tr);

    if (p.price) updateCalcCells(p.id);
  });

  updateSummary();
}

function deleteProduct(id) {
  products = products.filter(x => x.id !== id);
  renderTable();
}

function resetAll() {
  if (!confirm('모든 제안가를 초기화할까요?')) return;
  products.forEach(p => p.price = '');
  renderTable();
}

// ── 요약 바 ───────────────────────────────────────────────
function updateSummary() {
  const results = products.map(p => calc(p)).filter(Boolean);
  document.getElementById('sum-count').textContent = results.length;
  if (!results.length) {
    ['sum-avg-rate','sum-best','sum-worst'].forEach(id => {
      document.getElementById(id).textContent = '—';
    });
    return;
  }
  const rates   = results.map(r => r.marginRate);
  const margins = results.map(r => r.marginPack);
  const avg     = rates.reduce((a,b) => a+b, 0) / rates.length;
  const best    = Math.max(...margins);
  const worst   = Math.min(...margins);
  document.getElementById('sum-avg-rate').textContent = fmtRate(avg);
  document.getElementById('sum-best').textContent = (best >= 0 ? '+' : '') + fmt(best) + '₩';
  document.getElementById('sum-worst').textContent = (worst >= 0 ? '+' : '') + fmt(worst) + '₩';
}

// ── 배송비 패널 ───────────────────────────────────────────
function renderShipping() {
  const grid = document.getElementById('shipping-grid');
  grid.innerHTML = '';
  shippingTable.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'shipping-item';
    const label = document.createElement('label');
    label.textContent = s.qty + '팩';
    const input = document.createElement('input');
    input.type = 'number';
    input.value = s.fee;
    input.addEventListener('change', () => {
      shippingTable[i].fee = parseFloat(input.value) || 0;
      products.forEach(p => updateCalcCells(p.id));
    });
    div.appendChild(label);
    div.appendChild(input);
    grid.appendChild(div);
  });
}

let panelOpen = false;
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel-body').classList.toggle('hidden', !panelOpen);
  document.getElementById('panel-toggle').textContent = panelOpen ? '▲ 접기' : '▼ 펼치기';
}

// ── 모달 ──────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('active');
  document.getElementById('new-name').focus();
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  ['new-name','new-cost','new-pack','new-bottle','new-fee'].forEach(id => {
    document.getElementById(id).value = '';
  });
}
function addProduct() {
  const name   = document.getElementById('new-name').value.trim();
  const cost   = parseFloat(document.getElementById('new-cost').value)   || 0;
  const pack   = parseFloat(document.getElementById('new-pack').value)   || 1;
  const bottle = parseFloat(document.getElementById('new-bottle').value) || 1;
  const fee    = parseFloat(document.getElementById('new-fee').value)    || 12;
  if (!name) { alert('상품명을 입력해주세요'); return; }
  products.push({ id: nextId++, name, cost, pack, bottle, fee, price: '' });
  closeModal();
  renderTable();
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── 초기 실행 ─────────────────────────────────────────────
renderShipping();
renderTable();
</script>
</body>
